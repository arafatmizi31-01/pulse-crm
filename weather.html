<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherFlow - Real-time Weather Dashboard</title>
  <meta name="description" content="Real-time weather dashboard with forecasts and alerts.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%233b82f6%22 stroke-width=%222.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2712%27 cy=%2712%27 r=%275%27/><line x1=%2712%27 y1=%271%27 x2=%2712%27 y2=%273%27 stroke=%22currentColor%22 stroke-width=%222%22/></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'weather-bg': '#0f172a',
            'weather-card': 'rgba(15, 23, 42, 0.8)',
            'glass-border': 'rgba(255, 255, 255, 0.1)',
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  
  <style>
    body { background-color: #0f172a; color: #e2e8f0; }
    .weather-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .loading-spinner {
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-boundary {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 0.75rem;
      padding: 1rem;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body class="bg-weather-bg text-slate-100 antialiased font-sans">
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Weather Icons Component
    const WeatherIcon = ({ condition, size = "md" }) => {
      const sizeClasses = {
        sm: "w-6 h-6",
        md: "w-8 h-8",
        lg: "w-12 h-12",
        xl: "w-16 h-16"
      };

      const getIcon = (cond) => {
        const condLower = cond?.toLowerCase() || "";
        if (condLower.includes("clear") || condLower.includes("sunny")) return "☀️";
        if (condLower.includes("cloud")) return "☁️";
        if (condLower.includes("rain")) return "🌧️";
        if (condLower.includes("thunder")) return "⛈️";
        if (condLower.includes("snow")) return "❄️";
        if (condLower.includes("mist") || condLower.includes("fog")) return "🌫️";
        return "🌤️";
      };

      return <span className={sizeClasses[size]}>{getIcon(condition)}</span>;
    };

    // Main Weather Dashboard Component
    const WeatherDashboard = () => {
      const [city, setCity] = useState("London");
      const [weatherData, setWeatherData] = useState(null);
      const [forecastData, setForecastData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [unit, setUnit] = useState("metric");
      const [apiMethod, setApiMethod] = useState("demo"); // demo or api

      // Mock weather data
      const mockWeatherData = {
        "London": { name: "London", country: "GB", temp: 18, feels_like: 16, humidity: 72, wind_speed: 5.2, pressure: 1013, visibility: 10, clouds: 45, condition: "Partly Cloudy", sunrise: "06:45", sunset: "20:15" },
        "Tokyo": { name: "Tokyo", country: "JP", temp: 25, feels_like: 24, humidity: 68, wind_speed: 3.8, pressure: 1015, visibility: 8, clouds: 30, condition: "Clear", sunrise: "05:30", sunset: "19:00" },
        "New York": { name: "New York", country: "US", temp: 22, feels_like: 20, humidity: 65, wind_speed: 6.1, pressure: 1012, visibility: 9, clouds: 50, condition: "Cloudy", sunrise: "06:15", sunset: "20:30" },
      };

      const mockForecast = [
        { date: "Sep 15", temp: 20, condition: "Partly Cloudy", humidity: 70 },
        { date: "Sep 16", temp: 19, condition: "Rainy", humidity: 85 },
        { date: "Sep 17", temp: 21, condition: "Clear", humidity: 60 },
        { date: "Sep 18", temp: 18, condition: "Cloudy", humidity: 75 },
        { date: "Sep 19", temp: 22, condition: "Sunny", humidity: 55 }
      ];

      // Fixed: Proper error handling & CORS support
      const fetchWeather = async (cityName, method = "demo") => {
        setLoading(true);
        setError(null);
        
        try {
          if (method === "demo") {
            // Simulate API delay
            await new Promise(resolve => setTimeout(resolve, 800));
            
            const cityKey = Object.keys(mockWeatherData).find(
              key => key.toLowerCase() === cityName.toLowerCase()
            );
            
            if (cityKey) {
              setWeatherData({ name: mockWeatherData[cityKey].name, country: mockWeatherData[cityKey].country, sys: { country: mockWeatherData[cityKey].country }, main: { temp: mockWeatherData[cityKey].temp, feels_like: mockWeatherData[cityKey].feels_like, humidity: mockWeatherData[cityKey].humidity, pressure: mockWeatherData[cityKey].pressure }, weather: [{ main: mockWeatherData[cityKey].condition, description: mockWeatherData[cityKey].condition }], wind: { speed: mockWeatherData[cityKey].wind_speed }, visibility: mockWeatherData[cityKey].visibility * 1000, clouds: { all: mockWeatherData[cityKey].clouds }, sys: { sunrise: Math.floor(new Date(`2024-01-01 ${mockWeatherData[cityKey].sunrise}`).getTime() / 1000), sunset: Math.floor(new Date(`2024-01-01 ${mockWeatherData[cityKey].sunset}`).getTime() / 1000), country: mockWeatherData[cityKey].country } });
              setForecastData({ list: mockForecast.map((f, i) => ({ dt: Math.floor(Date.now() / 1000) + i * 86400, dt_txt: `2024-09-${15 + i} 12:00:00`, main: { temp: f.temp, humidity: f.humidity }, weather: [{ main: f.condition }] })) });
            } else {
              setError(`City not found - Try: London, Tokyo, or New York`);
            }
          } else {
            // Real API with proper error handling
            const apiKey = "6d8fb5b93d4af21c66a2948710284366";
            const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(cityName)}&units=${unit}&appid=${apiKey}`;
            
            const weatherResponse = await fetch(weatherUrl);
            if (!weatherResponse.ok) {
              throw new Error(weatherResponse.status === 404 ? "City not found" : "API Error");
            }
            
            const weather = await weatherResponse.json();
            setWeatherData(weather);
            
            const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(cityName)}&units=${unit}&appid=${apiKey}`;
            const forecastResponse = await fetch(forecastUrl);
            if (forecastResponse.ok) {
              setForecastData(await forecastResponse.json());
            }
          }
        } catch (err) {
          setError(err.message || "Unable to fetch weather data");
          setWeatherData(null);
          setForecastData(null);
        } finally {
          setLoading(false);
        }
      };

      // Fixed: useEffect with proper dependencies
      useEffect(() => {
        fetchWeather(city, apiMethod);
      }, [unit, apiMethod]);

      const handleSearch = (e) => {
        e.preventDefault();
        if (city.trim()) {
          fetchWeather(city, apiMethod);
        }
      };

      // Fixed: Safe forecast parsing
      const getDailyForecast = () => {
        if (!forecastData?.list) return [];
        const dailyData = {};
        forecastData.list.forEach(item => {
          const date = item.dt_txt?.split(" ")[0] || "";
          if (date && !dailyData[date]) {
            dailyData[date] = item;
          }
        });
        return Object.values(dailyData).slice(0, 5);
      };

      return (
        <div className="min-h-screen bg-weather-bg p-4 md:p-8">
          <div className="max-w-6xl mx-auto">
            <div className="mb-8">
              <h1 className="text-4xl md:text-5xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">WeatherFlow</h1>
              <p className="text-slate-400">Real-time weather forecasts at your fingertips</p>
            </div>

            <div className="mb-8">
              <form onSubmit={handleSearch} className="flex gap-3 mb-4 flex-col sm:flex-row">
                <input
                  type="text"
                  value={city}
                  onChange={(e) => setCity(e.target.value)}
                  placeholder="Enter city name..."
                  className="flex-1 px-4 py-3 rounded-lg bg-slate-800 text-white placeholder-slate-400 border border-slate-700 focus:border-blue-500 focus:outline-none transition"
                />
                <button type="submit" className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition">Search</button>
                <button type="button" onClick={() => setUnit(unit === "metric" ? "imperial" : "metric")} className="px-4 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-medium transition" title={unit === "metric" ? "Switch to °F" : "Switch to °C"}>{unit === "metric" ? "°C" : "°F"}</button>
                <select value={apiMethod} onChange={(e) => setApiMethod(e.target.value)} className="px-4 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-medium transition cursor-pointer">
                  <option value="demo">Demo</option>
                  <option value="api">Live API</option>
                </select>
              </form>
            </div>

            {loading && (
              <div className="flex justify-center items-center py-20">
                <div className="loading-spinner"></div>
              </div>
            )}

            {error && (
              <div className="error-boundary">
                <p className="text-red-400">❌ {error}</p>
              </div>
            )}

            {weatherData && !loading && (
              <>
                <div className="weather-card rounded-2xl p-8 mb-8">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-8">
                    <div className="flex-1">
                      <h2 className="text-3xl font-bold mb-2">{weatherData.name}, {weatherData.sys?.country || weatherData.country || "N/A"}</h2>
                      <p className="text-slate-400 mb-4">{weatherData.weather?.[0]?.description || "Weather info unavailable"}</p>
                      <div className="flex items-baseline gap-2">
                        <span className="text-6xl font-bold">{Math.round(weatherData.main?.temp || 0)}°</span>
                        <span className="text-2xl text-slate-400">{unit === "metric" ? "C" : "F"}</span>
                      </div>
                    </div>
                    <div className="text-center text-6xl">
                      <WeatherIcon condition={weatherData.weather?.[0]?.main} />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8 pt-8 border-t border-glass-border">
                    <div>
                      <p className="text-slate-400 text-sm mb-1">Feels Like</p>
                      <p className="text-xl font-semibold">{Math.round(weatherData.main?.feels_like || 0)}°</p>
                    </div>
                    <div>
                      <p className="text-slate-400 text-sm mb-1">Humidity</p>
                      <p className="text-xl font-semibold">{weatherData.main?.humidity || 0}%</p>
                    </div>
                    <div>
                      <p className="text-slate-400 text-sm mb-1">Wind Speed</p>
                      <p className="text-xl font-semibold">{(weatherData.wind?.speed || 0).toFixed(1)} m/s</p>
                    </div>
                    <div>
                      <p className="text-slate-400 text-sm mb-1">Pressure</p>
                      <p className="text-xl font-semibold">{weatherData.main?.pressure || 0} mb</p>
                    </div>
                  </div>
                </div>

                {getDailyForecast().length > 0 && (
                  <div>
                    <h3 className="text-2xl font-bold mb-4">5-Day Forecast</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                      {getDailyForecast().map((day, index) => (
                        <div key={index} className="weather-card rounded-xl p-4 text-center hover:border-blue-400 transition">
                          <p className="text-slate-400 text-sm mb-3">{day.dt_txt?.split(" ")[0] || ""}</p>
                          <div className="text-4xl mb-3"><WeatherIcon condition={day.weather?.[0]?.main} /></div>
                          <p className="font-semibold mb-2">{Math.round(day.main?.temp || 0)}°</p>
                          <p className="text-xs text-slate-400">{day.weather?.[0]?.main || ""}</p>
                          <p className="text-xs text-slate-500 mt-2">💧 {day.main?.humidity || 0}%</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}

            {!weatherData && !loading && !error && (
              <div className="text-center py-20">
                <div className="text-6xl mb-4">🌍</div>
                <p className="text-slate-400 text-lg">Search for a city to get started</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<WeatherDashboard />);
  </script>
</body>
</html>
