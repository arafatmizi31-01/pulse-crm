<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherFlow - Real-time Weather Dashboard</title>
  <meta name="description" content="Real-time weather dashboard with forecasts and alerts.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%233b82f6%22 stroke-width=%222.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M12 2.69l5.66 5.66a8 8 0 1 1-11.32 0z%22/></svg>">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'weather-bg': '#0f172a',
            'weather-card': 'rgba(15, 23, 42, 0.8)',
            'glass-border': 'rgba(255, 255, 255, 0.1)',
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  
  <style>
    body { background-color: #0f172a; color: #e2e8f0; }
    .weather-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .weather-gradient-1 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .weather-gradient-2 { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .weather-gradient-3 { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .loading-spinner {
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-weather-bg text-slate-100 antialiased font-sans">
  <div id="root"></div>

  <!-- React & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Weather Icons Component
    const WeatherIcon = ({ condition, size = "md" }) => {
      const sizeClasses = {
        sm: "w-6 h-6",
        md: "w-8 h-8",
        lg: "w-12 h-12",
        xl: "w-16 h-16"
      };

      const icons = {
        "Clear": <svg className={`${sizeClasses[size]} text-yellow-400`} fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3" stroke="currentColor" strokeWidth="2"/><line x1="12" y1="21" x2="12" y2="23" stroke="currentColor" strokeWidth="2"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" stroke="currentColor" strokeWidth="2"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" stroke="currentColor" strokeWidth="2"/><line x1="1" y1="12" x2="3" y2="12" stroke="currentColor" strokeWidth="2"/><line x1="21" y1="12" x2="23" y2="12" stroke="currentColor" strokeWidth="2"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" stroke="currentColor" strokeWidth="2"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" stroke="currentColor" strokeWidth="2"/></svg>,
        "Clouds": <svg className={`${sizeClasses[size]} text-gray-400`} fill="currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>,
        "Rain": <svg className={`${sizeClasses[size]} text-blue-400`} fill="currentColor" viewBox="0 0 24 24"><path d="M6 18c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm3-11c.83-1.42 1-2.68 1-4 0-3.31-2.69-6-6-6S-1 9.69-1 13s2.69 6 6 6c1.32 0 2.58.17 4-1z" transform="translate(6 -5)"/></svg>,
        "Thunderstorm": <svg className={`${sizeClasses[size]} text-purple-400`} fill="currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4c-2.89 0-5.4 1.64-6.65 4.04C2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/><path d="M11 15h2v4h-2zm-2-2h2v4H9z" fill="currentColor"/></svg>,
        "Snow": <svg className={`${sizeClasses[size]} text-cyan-200`} fill="currentColor" viewBox="0 0 24 24"><path d="M20.79 13.12L14.35 14.8l3.24-5.62-5.18 0-3.24-5.62 6.44-1.68-4.12-7.14-2.16 3.73-2.16-3.73-4.12 7.14 6.44 1.68-3.24 5.62 5.18 0 3.24 5.62-6.44 1.68 4.12 7.14 2.16-3.73 2.16 3.73z"/></svg>,
        "Mist": <svg className={`${sizeClasses[size]} text-gray-500`} fill="currentColor" viewBox="0 0 24 24"><path d="M1 9h8V7H1v2zm0 4h8v-2H1v2zm0 4h8v-2H1v2zm15-7h8V7h-8v3zm0 4h8v-2h-8v2zm0 4h8v-2h-8v2z"/></svg>,
      };

      return icons[condition] || icons["Clouds"];
    };

    // Main Weather Dashboard Component
    const WeatherDashboard = () => {
      const [city, setCity] = useState("London");
      const [weatherData, setWeatherData] = useState(null);
      const [forecastData, setForecastData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [unit, setUnit] = useState("metric"); // metric for Celsius, imperial for Fahrenheit

      // Fetch weather data from OpenWeatherMap API
      const fetchWeather = async (cityName) => {
        setLoading(true);
        setError(null);
        try {
          // Using free tier API - OpenWeatherMap
          const apiKey = "6d8fb5b93d4af21c66a2948710284366"; // Free API key
          
          // Current weather
          const weatherResponse = await fetch(
            `https://api.openweathermap.org/data/2.5/weather?q=${cityName}&units=${unit}&appid=${apiKey}`
          );
          
          if (!weatherResponse.ok) {
            throw new Error("City not found");
          }
          
          const weather = await weatherResponse.json();
          setWeatherData(weather);

          // Forecast data
          const forecastResponse = await fetch(
            `https://api.openweathermap.org/data/2.5/forecast?q=${cityName}&units=${unit}&appid=${apiKey}`
          );
          const forecast = await forecastResponse.json();
          setForecastData(forecast);

        } catch (err) {
          setError(err.message);
          setWeatherData(null);
          setForecastData(null);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchWeather(city);
      }, [unit]);

      const handleSearch = (e) => {
        e.preventDefault();
        if (city.trim()) {
          fetchWeather(city);
        }
      };

      // Get unique forecast days
      const getDailyForecast = () => {
        if (!forecastData) return [];
        const dailyData = {};
        forecastData.list.forEach(item => {
          const date = item.dt_txt.split(" ")[0];
          if (!dailyData[date]) {
            dailyData[date] = item;
          }
        });
        return Object.values(dailyData).slice(0, 5);
      };

      return (
        <div className="min-h-screen bg-weather-bg p-4 md:p-8">
          <div className="max-w-6xl mx-auto">
            {/* Header */}
            <div className="mb-8">
              <h1 className="text-4xl md:text-5xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">WeatherFlow</h1>
              <p className="text-slate-400">Real-time weather forecasts at your fingertips</p>
            </div>

            {/* Search Bar */}
            <div className="mb-8">
              <form onSubmit={handleSearch} className="flex gap-3 mb-4">
                <input
                  type="text"
                  value={city}
                  onChange={(e) => setCity(e.target.value)}
                  placeholder="Enter city name..."
                  className="flex-1 px-4 py-3 rounded-lg bg-slate-800 text-white placeholder-slate-400 border border-slate-700 focus:border-blue-500 focus:outline-none transition"
                />
                <button
                  type="submit"
                  className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition"
                >
                  Search
                </button>
                <button
                  type="button"
                  onClick={() => setUnit(unit === "metric" ? "imperial" : "metric")}
                  className="px-4 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-medium transition"
                  title={unit === "metric" ? "Switch to °F" : "Switch to °C"}
                >
                  {unit === "metric" ? "°C" : "°F"}
                </button>
              </form>
            </div>

            {/* Loading State */}
            {loading && (
              <div className="flex justify-center items-center py-20">
                <div className="loading-spinner"></div>
              </div>
            )}

            {/* Error State */}
            {error && (
              <div className="bg-red-900/20 border border-red-500/50 rounded-lg p-4 mb-8 text-red-400">
                ❌ {error} - Please try another city
              </div>
            )}

            {/* Current Weather */}
            {weatherData && !loading && (
              <>
                <div className="weather-card rounded-2xl p-8 mb-8">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-8">
                    <div className="flex-1">
                      <h2 className="text-3xl font-bold mb-2">{weatherData.name}, {weatherData.sys.country}</h2>
                      <p className="text-slate-400 mb-4">{weatherData.weather[0].description}</p>
                      <div className="flex items-baseline gap-2">
                        <span className="text-6xl font-bold">{Math.round(weatherData.main.temp)}°</span>
                        <span className="text-2xl text-slate-400">{unit === "metric" ? "C" : "F"}</span>
                      </div>
                    </div>
                    <div className="text-center">
                      <WeatherIcon condition={weatherData.weather[0].main} size="xl" />
                      <p className="text-slate-400 mt-2 capitalize">{weatherData.weather[0].main}</p>
                    </div>
                  </div>

                  {/* Weather Details Grid */}
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8 pt-8 border-t border-glass-border">
                    <div>
                      <p className="text-slate-400 text-sm mb-1">Feels Like</p>
                      <p className="text-xl font-semibold">{Math.round(weatherData.main.feels_like)}°</p>
                    </div>
                    <div>
                      <p className="text-slate-400 text-sm mb-1">Humidity</p>
                      <p className="text-xl font-semibold">{weatherData.main.humidity}%</p>
                    </div>
                    <div>
                      <p className="text-slate-400 text-sm mb-1">Wind Speed</p>
                      <p className="text-xl font-semibold">{weatherData.wind.speed} m/s</p>
                    </div>
                    <div>
                      <p className="text-slate-400 text-sm mb-1">Pressure</p>
                      <p className="text-xl font-semibold">{weatherData.main.pressure} mb</p>
                    </div>
                    <div>
                      <p className="text-slate-400 text-sm mb-1">Visibility</p>
                      <p className="text-xl font-semibold">{(weatherData.visibility / 1000).toFixed(1)} km</p>
                    </div>
                    <div>
                      <p className="text-slate-400 text-sm mb-1">Clouds</p>
                      <p className="text-xl font-semibold">{weatherData.clouds.all}%</p>
                    </div>
                    <div>
                      <p className="text-slate-400 text-sm mb-1">Sunrise</p>
                      <p className="text-xl font-semibold">{new Date(weatherData.sys.sunrise * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                    </div>
                    <div>
                      <p className="text-slate-400 text-sm mb-1">Sunset</p>
                      <p className="text-xl font-semibold">{new Date(weatherData.sys.sunset * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                    </div>
                  </div>
                </div>

                {/* 5 Day Forecast */}
                {forecastData && (
                  <div>
                    <h3 className="text-2xl font-bold mb-4">5-Day Forecast</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                      {getDailyForecast().map((day, index) => (
                        <div key={index} className="weather-card rounded-xl p-4 text-center hover:border-blue-400 transition">
                          <p className="text-slate-400 text-sm mb-3">
                            {new Date(day.dt * 1000).toLocaleDateString([], {month: 'short', day: 'numeric'})}
                          </p>
                          <div className="flex justify-center mb-3">
                            <WeatherIcon condition={day.weather[0].main} size="md" />
                          </div>
                          <p className="font-semibold mb-2">{Math.round(day.main.temp)}°</p>
                          <p className="text-xs text-slate-400 capitalize">{day.weather[0].main}</p>
                          <p className="text-xs text-slate-500 mt-2">💧 {day.main.humidity}%</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}

            {/* Initial State */}
            {!weatherData && !loading && !error && (
              <div className="text-center py-20">
                <svg className="w-16 h-16 mx-auto mb-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <p className="text-slate-400 text-lg">Search for a city to get started</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<WeatherDashboard />);
  </script>
</body>
</html>
