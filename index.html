                  <p className="text-xs text-slate-400 mb-1">Subscribers: {plan.subscribers}</p>
                  <p className="text-lg font-bold text-emerald-400">{plan.mrr} MRR</p>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="glass-card rounded-2xl p-6">
          <h3 className="text-xl font-bold text-white mb-4">Churn Analysis</h3>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">

              <p className="text-sm text-slate-400 mb-2">Monthly Churn Rate</p>
              <p className="text-2xl font-bold text-white">2.3%</p>
              <p className="text-xs text-emerald-400 mt-1">↓ 0.5% from last month</p>
            </div>
            <div className="glass-card rounded-xl p-4">
              <p className="text-sm text-slate-400 mb-2">Churned Customers</p>
              <p className="text-2xl font-bold text-white">12</p>
              <p className="text-xs text-slate-500 mt-1">This month</p>
            </div>
            <div className="glass-card rounded-xl p-4">
              <p className="text-sm text-slate-400 mb-2">Retention Rate</p>
              <p className="text-2xl font-bold text-emerald-400">97.7%</p>
              <p className="text-xs text-slate-500 mt-1">High retention 🎉</p>
            </div>
          </div>
        </div>
      </div>

    const SettingsView = () => (

        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <div className="space-y-4">
              <div>

                <input type="email" value="admin@pulsecrm.io" className="w-full px-3 py-2 rounded-lg bg-white/10 border border-glass-border text-white focus:outline-none focus:border-indigo-500" />

              <div>
                <label className="text-sm text-slate-400 block mb-2">Company Name</label>
                <input type="text" value="PulseCRM Enterprise" className="w-full px-3 py-2 rounded-lg bg-white/10 border border-glass-border text-white focus:outline-none focus:border-indigo-500" />
              </div>
              <button className="w-full px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">Save Changes</button>
            </div>

          <div className="glass-card rounded-2xl p-6">
            <h3 className="text-lg font-bold text-white mb-4">Notification Preferences</h3>
            <div className="space-y-4">
              <label className="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" defaultChecked className="w-4 h-4 rounded" />
                <span className="text-sm text-slate-300">Email alerts</span>
              </label>
              <label className="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" defaultChecked className="w-4 h-4 rounded" />
                <span className="text-sm text-slate-300">Weekly reports</span>
              </label>
              <label className="flex items-center gap-3 cursor-pointer">
                <input type="checkbox" className="w-4 h-4 rounded" />
                <span className="text-sm text-slate-300">Marketing emails</span>
              </label>
            </div>
          </div>

          <div className="glass-card rounded-2xl p-6">
            <h3 className="text-lg font-bold text-white mb-4">Integrations</h3>
            <div className="space-y-3">
              <div className="flex items-center justify-between p-3 rounded-lg bg-white/5">
                <span className="text-sm text-slate-300">Slack</span>
                <span className="px-2 py-1 rounded-full text-xs bg-emerald-500/20 text-emerald-400">Connected</span>
              </div>
              <div className="flex items-center justify-between p-3 rounded-lg bg-white/5">
                <span className="text-sm text-slate-300">Stripe</span>
                <span className="px-2 py-1 rounded-full text-xs bg-emerald-500/20 text-emerald-400">Connected</span>

              <div className="flex items-center justify-between p-3 rounded-lg bg-white/5">

                <span className="px-2 py-1 rounded-full text-xs bg-amber-500/20 text-amber-400">Not Connected</span>

          <div className="space-y-4">

            <button className="w-full px-4 py-3 rounded-lg bg-white/5 hover:bg-white/10 text-white font-medium text-left transition">Two-Factor Authentication</button>

    const App = () => {

      return (
        <div className="flex h-screen bg-[#030307] text-white">
          {/* Desktop Sidebar */}
          <div className="hidden lg:flex w-64 border-r border-glass-border">
            <SidebarContent activeTab={activeTab} setActiveTab={setActiveTab} />
          </div>

          {/* Mobile Sidebar */}
          {sidebarOpen && (
            <div className="fixed inset-0 z-40 lg:hidden">
              <div className="absolute inset-0 bg-black/50" onClick={() => setSidebarOpen(false)}></div>
              <div className="absolute left-0 top-0 bottom-0 w-64 border-r border-glass-border z-50">
                <SidebarContent activeTab={activeTab} setActiveTab={setActiveTab} onClose={() => setSidebarOpen(false)} />
              </div>
            </div>
          )}

          {/* Main Content */}
          <div className="flex-1 flex flex-col">
            <div className="h-16 border-b border-glass-border flex items-center px-6 justify-between">

                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" /></svg>

              </div>

            <div className="flex-1 overflow-auto">
              <div className="p-6 lg:p-8">
                {activeTab === 'Dashboard' && <DashboardView />}
                {activeTab === 'CRM Pipeline' && <CRMPipelineView />}
                {activeTab === 'Order List' && <OrderListView />}
                {activeTab === 'Invoices' && <InvoicesView />}
                {activeTab === 'Subscriptions' && <SubscriptionsView />}
                {activeTab === 'Settings' && <SettingsView />}
              </div>
            </div>
          </div>
        </div>

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
